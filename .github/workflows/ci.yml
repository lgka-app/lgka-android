name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build (core + extractor tests, app debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lgka-app/verification
          path: verification
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          LGKA_VERIFICATION_DIR: ${{ github.workspace }}/verification
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lgka-debug-apk
          path: app/build/outputs/apk/debug/*.apk
