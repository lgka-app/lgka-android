name: Release

# Tag vX.Y.Z → build + tests, signed AAB with its release notes to the Play production track,
# sent for review right away (fastlane/Fastfile). "metadata" uploads only the store listing
# (texts + screenshots) and sends it for review too.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      lane:
        description: "release = signed AAB to production, sent for review; metadata = store listing only"
        type: choice
        options: [release, metadata]
        default: release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: fastlane android ${{ inputs.lane || 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload the signed APK to the GitHub release
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Set to "true" only while Managed Publishing is on in Play Console (fastlane/Fastfile).
      PLAY_MANAGED_PUBLISHING: ${{ vars.PLAY_MANAGED_PUBLISHING }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-java@v6
        if: inputs.lane != 'metadata'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        if: inputs.lane != 'metadata'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6
        if: inputs.lane != 'metadata'
      - name: Decode upload keystore
        if: inputs.lane != 'metadata'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
      - name: Build, test, lint
        if: inputs.lane != 'metadata'
        run: ./gradlew build --no-daemon
      - name: fastlane
        run: bundle exec fastlane android ${{ inputs.lane || 'release' }}
      - name: Attach the signed APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lgka-${GITHUB_REF_NAME}.apk"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/lgka-${GITHUB_REF_NAME}.apk" --clobber
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
